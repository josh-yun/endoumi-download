name: Publish download page

on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare latest installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/downloads

          temporary_dir="$RUNNER_TEMP/endoumi-release"
          mkdir -p "$temporary_dir"
          windows_version=""; macos_version=""
          while read -r tag; do
            if [[ -z "$windows_version" ]] && gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.exe' --dir "$temporary_dir/windows"; then
              windows_version="${tag#v}"
            fi
            if [[ -z "$macos_version" ]] && gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.dmg' --dir "$temporary_dir/macos"; then
              macos_version="${tag#v}"
            fi
            [[ -z "$windows_version" || -z "$macos_version" ]] || break
          done < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 --json tagName --jq '.[].tagName')
          windows_file="$(find "$temporary_dir/windows" -name '*.exe' -print -quit)"
          macos_file="$(find "$temporary_dir/macos" -name '*.dmg' -print -quit)"
          [[ -n "$windows_file" && -n "$macos_file" ]]
          cp "$windows_file" site/downloads/Endoumi-Windows-x64.exe
          cp "$macos_file" site/downloads/Endoumi-macOS.dmg
          (cd site/downloads && sha256sum Endoumi-Windows-x64.exe Endoumi-macOS.dmg > SHA256SUMS.txt)
          published_at="$(gh release view "v$windows_version" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq '.publishedAt[0:10]')"
          jq -n --arg version "$windows_version" --arg windowsVersion "$windows_version" --arg macosVersion "$macos_version" --arg publishedAt "$published_at" \
            '{available: true, version: $version, windowsVersion: $windowsVersion, macosVersion: $macosVersion, publishedAt: $publishedAt}' > site/release.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
